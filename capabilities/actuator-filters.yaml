naftiko: 1.0.0-alpha2
info:
  label: Spring Cloud Gateway Actuator API — Filters
  description: 'Spring Cloud Gateway Actuator API — Filters. 2 operations. Lead operation: List All Global Filters. Self-contained
    Naftiko capability covering one Spring Cloud Gateway business surface.'
  tags:
  - Spring Cloud Gateway
  - Filters
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPRING_CLOUD_GATEWAY_API_KEY: SPRING_CLOUD_GATEWAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: actuator-filters
    baseUri: http://localhost:8080/actuator/gateway
    description: Spring Cloud Gateway Actuator API — Filters business capability. Self-contained, no shared references.
    resources:
    - name: globalfilters
      path: /globalfilters
      operations:
      - name: getglobalfilters
        method: GET
        description: List All Global Filters
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: routefilters
      path: /routefilters
      operations:
      - name: getroutefilters
        method: GET
        description: List All Available Route Filter Factories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: actuator-filters-rest
    port: 8080
    description: REST adapter for Spring Cloud Gateway Actuator API — Filters. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/globalfilters
      name: globalfilters
      description: REST surface for globalfilters.
      operations:
      - method: GET
        name: getglobalfilters
        description: List All Global Filters
        call: actuator-filters.getglobalfilters
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/routefilters
      name: routefilters
      description: REST surface for routefilters.
      operations:
      - method: GET
        name: getroutefilters
        description: List All Available Route Filter Factories
        call: actuator-filters.getroutefilters
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: actuator-filters-mcp
    port: 9090
    transport: http
    description: MCP adapter for Spring Cloud Gateway Actuator API — Filters. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-all-global-filters
      description: List All Global Filters
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: actuator-filters.getglobalfilters
      outputParameters:
      - type: object
        mapping: $.
    - name: list-all-available-route-filter
      description: List All Available Route Filter Factories
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: actuator-filters.getroutefilters
      outputParameters:
      - type: object
        mapping: $.
