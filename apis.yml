aid: spring-cloud-gateway
name: Spring Cloud Gateway
description: >-
  Spring Cloud Gateway provides an intelligent, programmable router built
  on Spring WebFlux that offers API gateway functionality for microservices
  including routing, filtering, load balancing, and rate limiting.
type: Index
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - API Gateway
  - Microservices
  - Routing
  - Spring
url: >-
  https://raw.githubusercontent.com/api-evangelist/spring-cloud-gateway/refs/heads/main/apis.yml
created: '2026-03-16'
modified: '2026-03-18'
specificationVersion: '0.19'
apis:
  - aid: spring-cloud-gateway:spring-cloud-gateway-api
    name: Spring Cloud Gateway API
    description: >-
      Intelligent API gateway built on Spring WebFlux offering routing,
      predicate and filter capabilities, load balancing, circuit breaking,
      and rate limiting for microservice architectures.
    humanURL: https://spring.io/projects/spring-cloud-gateway
    tags:
      - API Gateway
      - Routing
      - Spring WebFlux
    properties:
      - type: Documentation
        url: https://docs.spring.io/spring-cloud-gateway/docs/current/reference/html/
      - type: Getting Started
        url: https://spring.io/projects/spring-cloud-gateway#learn
      - type: Reference
        url: https://docs.spring.io/spring-cloud-gateway/docs/current/reference/html/#gateway-starter
      - type: GitHubRepository
        url: https://github.com/spring-cloud/spring-cloud-gateway
      - type: Change Log
        url: https://github.com/spring-cloud/spring-cloud-gateway/releases
  - aid: spring-cloud-gateway:spring-cloud-gateway-actuator-api
    name: Spring Cloud Gateway Actuator API
    description: >-
      The Spring Cloud Gateway Actuator API exposes HTTP endpoints for
      managing and monitoring gateway routes at runtime, including retrieving
      route definitions, creating and deleting routes, refreshing the route
      cache, and querying available filters and metrics.
    humanURL: https://docs.spring.io/spring-cloud-gateway/docs/current/reference/html/#actuator-api
    tags:
      - Actuator
      - Management
      - Monitoring
      - Routes
    properties:
      - type: Documentation
        url: https://docs.spring.io/spring-cloud-gateway/docs/current/reference/html/#actuator-api
      - type: Reference
        url: https://docs.spring.io/spring-cloud-gateway/docs/current/reference/html/#retrieving-route-filters
